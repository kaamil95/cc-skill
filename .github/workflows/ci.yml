name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 链接安装依赖 NTFS junction、打包走 PowerShell，所以跑在 Windows 上
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts 跳过 Electron 二进制下载（上百 MB）：lint 与测试都用桩 electron，不需要真身
      - run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run format:check
      - run: npm test
