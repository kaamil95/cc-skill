name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 链接安装依赖 NTFS junction、打包走 PowerShell，所以跑在 Windows 上
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 是本项目支持的最低版本，CI 就卡在最低版本上跑 —— 踩过：Node 20 的
          # fs.rmSync 在 Windows 上删不掉「名字还在删除待定状态」的目录，market 集成
          # 测试的清理钩子会 ENOTEMPTY，而本地 Node 24 一切正常，于是 CI 一直是红的
          node-version: 22
          cache: npm

      # --ignore-scripts 跳过 Electron 二进制下载（上百 MB）：lint 与测试都用桩 electron，不需要真身
      - run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run format:check
      - run: npm test
