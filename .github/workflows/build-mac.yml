name: Build macOS

# macOS 产物只能在 macOS 上打（Windows / Linux 无法交叉构建 .app / .dmg），
# 所以这里用 macos runner 出包。手动触发。
#
# 打 tag 时不再走这里：Release 工作流会一并出 macOS 的 dmg 并挂到 Release 上，
# 两边都跑等于同一个 tag 上构建两遍 macOS。想单独拿一个 dmg 时用这个手动触发。
on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 是本项目支持的最低版本（见 package.json 的 engines）
          node-version: 22
          cache: npm

      # 与 CI 不同，这里需要真的 Electron 二进制（要打进 .app），所以不加 --ignore-scripts
      - run: npm ci

      - run: npm test

      # 没配开发者证书时明确跳过签名，免得 electron-builder 去翻钥匙串
      # 想签名 + 公证：在仓库 secrets 里配好证书与 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
      # APPLE_TEAM_ID，并去掉这一行（electron-builder 会自动完成签名与公证）
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: cc-skill-macos
          path: dist/*.dmg
          if-no-files-found: error
